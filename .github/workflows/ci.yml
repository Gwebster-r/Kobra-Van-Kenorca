name: Plugin CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GJS for UI tests
        run: sudo apt-get update && sudo apt-get install -y gjs

      - name: Run unit tests, size limit, and i18n checks
        run: |
          python3 -m unittest test_postprocess.py
          size=$(stat -c %s kobra_van_kenorca_plugin.py)
          echo "Plugin size: $size bytes"
          test "$size" -lt 1000000
          python3 -c 'import kobra_van_kenorca_plugin as p; assert set(p.TRANSLATIONS["en"]) == set(p.TRANSLATIONS["de"]); print("i18n keys OK:", len(p.TRANSLATIONS["en"]))'
